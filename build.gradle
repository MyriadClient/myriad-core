// Loom comes with the addon plugin (gradle-plugin, built with the Loom core uses), so core and the example addon share
// one copy of it.
plugins {
	id 'dev.myriadclient.addon' apply false
}

// Core's build. The example addon is built by the addon plugin, as any addon is.
project(':core') {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'maven-publish'

	version = rootProject.version
	group = rootProject.group

	repositories {
		mavenCentral()
	}

	loom {
		runs {
			configureEach {
				// All subprojects share one run directory so configs survive switching projects.
				runDir = "../run"
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def props = [
			version          : project.version,
			minecraft_version: rootProject.minecraft_version,
			loader_version   : rootProject.loader_version
		]
		inputs.properties props
		filesMatching("fabric.mod.json") {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = "UTF-8"
		it.options.compilerArgs += ["-Xmaxerrs", "10000"]
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		from(rootProject.file("LICENSE")) {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}

	// dev.myriadclient:myriad (with sources and javadoc) for addons. Releases publish it to Myriad's maven,
	// https://maven.myriadclient.dev/releases, with `./gradlew publishAllPublicationsToMyriadRepository` and the
	// myriadUsername and myriadPassword Gradle properties (the release workflow sets them from secrets).
	// `./gradlew publishToMavenLocal` is for building an addon against unreleased changes.
	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				from components.java
			}
		}
		repositories {
			maven {
				name = "myriad"
				url = "https://maven.myriadclient.dev/releases"
				credentials(PasswordCredentials)
			}
		}
	}
	afterEvaluate {
		publishing.publications.mavenJava.artifactId = base.archivesName.get()
	}
}
