plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'maven-publish'

	version = rootProject.version
	group = rootProject.group

	repositories {
		mavenCentral()
	}

	loom {
		runs {
			configureEach {
				// All subprojects share one run directory so configs survive switching projects.
				runDir = "../run"
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
	}

	processResources {
		def props = [
			version          : project.version,
			minecraft_version: rootProject.minecraft_version,
			loader_version   : rootProject.loader_version
		]
		inputs.properties props
		filesMatching("fabric.mod.json") {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = "UTF-8"
		it.options.compilerArgs += ["-Xmaxerrs", "10000"]
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	jar {
		from(rootProject.file("LICENSE")) {
			rename { "${it}_${project.base.archivesName.get()}" }
		}
	}

	// dev.myriadclient:myriad (with sources and javadoc) for addons. Releases publish it to Myriad's maven,
	// https://maven.myriadclient.dev/releases, with `./gradlew publishAllPublicationsToMyriadRepository` and the
	// myriadUsername and myriadPassword Gradle properties (the release workflow sets them from secrets).
	// `./gradlew publishToMavenLocal` is for building an addon against unreleased changes.
	publishing {
		publications {
			create("mavenJava", MavenPublication) {
				from components.java
			}
		}
		repositories {
			maven {
				name = "myriad"
				url = "https://maven.myriadclient.dev/releases"
				credentials(PasswordCredentials)
			}
		}
	}
	afterEvaluate {
		publishing.publications.mavenJava.artifactId = base.archivesName.get()
	}
}

// Addons (the example here, Essentials in its own repo) may only use Myriad's public API. dev.myriadclient.impl is internal and changes without
// notice, so referencing it from an addon fails the build here rather than breaking players' games later.
configure(subprojects.findAll { it.name != 'core' }) {
	def sources = fileTree("src/main/java") { include "**/*.java" }
	def root = rootDir
	def checkApiOnly = tasks.register("checkApiOnly") {
		group = "verification"
		description = "Fails if this addon references Myriad internals (dev.myriadclient.impl)."
		inputs.files(sources)
		doLast {
			def bad = []
			sources.each { f ->
				f.eachLine { line, n ->
					if (line.contains("dev.myriadclient.impl")) bad << "${root.toPath().relativize(f.toPath())}:${n}: ${line.trim()}"
				}
			}
			if (!bad.isEmpty()) {
				throw new GradleException("Addons may only use Myriad's API (dev.myriadclient.api.*), but these lines reference internals:\n  " + bad.join("\n  "))
			}
		}
	}
	tasks.named("compileJava") { dependsOn checkApiOnly }
}
