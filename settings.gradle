pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'myriad-root'

include 'core', 'example-addon'

// The dev.myriadclient.addon Gradle plugin, released with core (`./gradlew :gradle-plugin:build`).
includeBuild 'gradle-plugin'
