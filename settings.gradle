pluginManagement {
	// The dev.myriadclient.addon Gradle plugin, released with core: it builds the example addon here as it builds any addon.
	includeBuild 'gradle-plugin'
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'myriad-root'

include 'core', 'example-addon'
