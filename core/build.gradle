base {
	archivesName = "myriad"
}

loom {
	accessWidenerPath = file("src/main/resources/myriad.accesswidener")
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	// Mod Menu is optional: only its API is compiled against, and the integration loads only when it's installed.
	compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive = false }
	// Xaero's Minimap likewise: its waypoints are read only when it's installed (impl/map).
	compileOnly("maven.modrinth:xaeros-minimap:${rootProject.xaero_minimap_version}") { transitive = false }

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "net.fabricmc:fabric-loader-junit:${rootProject.loader_version}"
}

test {
	useJUnitPlatform()
	// The harness runs Minecraft's classes under Fabric's loader, which keeps its game folder (logs, config) here.
	workingDir = file("build/test-run")
	doFirst { workingDir.mkdirs() }
	// Dev checks on, as in the dev clients: a service called off the render thread is logged (Threads.assertRender).
	systemProperty "myriad.dev", "true"
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat = "full"
	}
}

// The published javadoc is the API addons build on (dev.myriadclient.api); the internals aren't part of it.
java {
	withJavadocJar()
}

javadoc {
	include 'dev/myriadclient/api/**'
	options.addStringOption('Xdoclint:all,-missing', '-quiet')
	options.addStringOption('encoding', 'UTF-8')
}

// Size budget for core's internals (impl): files up to 600 lines, methods up to 60. Warns with the offenders rather than
// failing; a file may say why it's bigger with a comment starting "// size:".
tasks.register("checkSizes") {
	group = "verification"
	description = "Warns about impl files over 600 lines (without a // size: reason) and methods over 60."
	def sources = fileTree("src/main/java/dev/myriadclient/impl") { include "**/*.java" }
	inputs.files(sources)
	doLast {
		// A method's first line (one tab per nesting level), not a control statement, a field, a lambda or an anonymous class.
		def methodStart = ~/^(\t+)(?!(if|for|while|switch|catch|else|try|do|synchronized|return|case|default)\b)[\w<>@\[\], .?]+\(.*$/
		List<String> warnings = []
		sources.each { File f ->
			def lines = f.readLines()
			def name = projectDir.toPath().relativize(f.toPath()).toString()
			if (lines.size() > 600 && !lines.any { it.trim().startsWith("// size:") }) warnings << "${name}: ${lines.size()} lines"
			for (int i = 0; i < lines.size(); i++) {
				def m = methodStart.matcher(lines[i])
				if (!m.matches() || lines[i].contains("=") || lines[i].contains("new ") || lines[i].trim().startsWith("return")) continue
				// The signature may wrap: its body opens on the first line ending in "{" before any ";".
				int open = i
				while (open < lines.size() && !lines[open].endsWith("{") && !lines[open].endsWith(";")) open++
				if (open >= lines.size() || lines[open].endsWith(";") || lines[open].contains("->")) continue
				def close = m.group(1) + "}"
				int end = open + 1
				while (end < lines.size() && lines[end] != close) end++
				int length = end - i + 1
				if (length > 60) warnings << "${name}:${i + 1}: ${lines[i].trim().take(80)} (${length} lines)"
				i = open
			}
		}
		if (warnings.isEmpty()) logger.lifecycle("checkSizes: everything within 600 lines a file, 60 a method")
		else logger.warn("checkSizes: ${warnings.size()} over budget (impl files 600 lines, methods 60):\n  " + warnings.join("\n  "))
	}
}
check.dependsOn checkSizes

// The API contract: dev.myriadclient.api against the last release's (api_baseline), with japicmp. A binary-incompatible
// change fails the build, except in a new major version; the full report (every change, additions included) is in
// build/reports/api. Addons built against the baseline keep working as long as this passes.
repositories {
	exclusiveContent {
		forRepositories(maven {
			name = "Myriad"
			url = "https://maven.myriadclient.dev/releases"
		})
		filter { includeGroup "dev.myriadclient" }
	}
}

configurations {
	japicmp
	apiBaseline { transitive = false }
}

dependencies {
	japicmp "com.github.siom79.japicmp:japicmp:0.26.5"
	apiBaseline "dev.myriadclient:myriad:${rootProject.api_baseline}"
}

def checkApi = tasks.register("checkApi", JavaExec) {
	group = "verification"
	description = "Compares dev.myriadclient.api with the last release (api_baseline) and fails on a binary-incompatible change."
	def newJar = tasks.named("jar").flatMap { it.archiveFile }
	def reports = layout.buildDirectory.dir("reports/api")
	def baseline = rootProject.api_baseline.toString()
	def current = project.version.toString()
	def apiClasspath = sourceSets.main.compileClasspath
	inputs.files(configurations.apiBaseline, newJar)
	outputs.dir(reports)
	classpath = configurations.japicmp
	mainClass = "japicmp.JApiCmp"
	// The exit value is read in doLast, to say what broke rather than only that something did.
	ignoreExitValue = true
	doFirst {
		def dir = reports.get().asFile
		dir.mkdirs()
		def cp = apiClasspath.asPath
		def a = ["--old", configurations.apiBaseline.singleFile.path, "--new", newJar.get().asFile.path,
			"--old-classpath", cp, "--new-classpath", cp, "--include", "dev.myriadclient.api", "--only-modified",
			"--html-file", new File(dir, "api.html").path, "--markdown"]
		// A new major may break; anything else must not.
		if (current.tokenize('.')[0].toInteger() <= baseline.tokenize('.')[0].toInteger()) a << "--error-on-binary-incompatibility"
		args = a
		standardOutput = new FileOutputStream(new File(dir, "api.md"))
	}
	doLast {
		def dir = reports.get().asFile
		// The report's table of types: one row each, "| Status | [type] | ... | compatibility changes |".
		def rows = new File(dir, "api.md").readLines().findAll { it ==~ /^\| (Added|Modified|Removed) +\| \[dev\.myriadclient.*/ }
		def count = { String status -> rows.count { it.startsWith("| ${status} ") } }
		def summary = "dev.myriadclient.api ${current} against ${baseline}: ${count('Added')} types added, ${count('Modified')} changed, " +
			"${count('Removed')} removed (${new File(dir, 'api.html')})"
		if (executionResult.get().exitValue == 0) {
			logger.lifecycle("checkApi: ${summary}")
			return
		}
		def broken = rows.findAll { it.startsWith("| Removed ") || it =~ /removed|changed|now final|now abstract|less accessible/ }
			.collect { (it =~ /\[([\w.$]+)\]/)[0][1] }
		throw new GradleException("checkApi: binary-incompatible changes to the API, which addons built against ${baseline} would break on: " +
			"${broken.unique().join(', ')}. Deprecate instead, and remove in a major release. ${summary}")
	}
}
check.dependsOn checkApi
