base {
	archivesName = "myriad"
}

loom {
	accessWidenerPath = file("src/main/resources/myriad.accesswidener")
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
	// Mod Menu is optional: only its API is compiled against, and the integration loads only when it's installed.
	compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive = false }

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// The published javadoc is the API addons build on (dev.myriadclient.api); the internals aren't part of it.
java {
	withJavadocJar()
}

javadoc {
	include 'dev/myriadclient/api/**'
	options.addStringOption('Xdoclint:all,-missing', '-quiet')
	options.addStringOption('encoding', 'UTF-8')
}
