// Built by Myriad's addon plugin, exactly as an addon in its own repository is (see the template): Loom, Minecraft,
// Fabric, the dev client and its switches, the API-only check and publishing all come from it. Inside Myriad's
// repository it builds against the :core project rather than a released core.
plugins {
	id 'dev.myriadclient.addon'
}

base {
	archivesName = "myriad-example-addon"
}
